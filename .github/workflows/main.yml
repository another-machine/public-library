# Simple workflow for deploying static content to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # compiling docs which is our homepage
      #
      # Packages with their own runtime dependencies need installing before the
      # docs build, because docs imports package SOURCE rather than a built
      # artifact — so Parcel resolves their imports from their own node_modules.
      # A package that gains a dependency and is not listed here fails the
      # deploy, not the local build, where node_modules is already populated.
      - run: npm i
        working-directory: packages/amplib-sound-transformation
      - run: npm i
        working-directory: packages/amplib-cosmos
      # sound-synthesis depends on @amplib/music-theory from npm rather than
      # inlining a copy of it — ChromaticWall takes a `Scale` as a parameter, so
      # a consumer holding both must hold the same one.
      - run: npm i
        working-directory: packages/amplib-sound-synthesis
      - run: npm i
      - run: npm i
        working-directory: docs
      - run: npm run build
        working-directory: docs

      # compiling lexicon-standoff
      - run: npm i
        working-directory: machines/lexicon-standoff
      - run: npm run build
        working-directory: machines/lexicon-standoff

      # compiling mindmeld
      - run: npm i
        working-directory: machines/mindmeld
      - run: npm run build
        working-directory: machines/mindmeld

      # renaming docs/dist to main site directory
      - run: mv ./docs/dist ./site
      # moving lexicon-standoff into site
      - run: mv ./machines/lexicon-standoff/dist ./site/lexicon-standoff
      # moving mindmeld into site
      - run: mv ./machines/mindmeld/dist ./site/mindmeld

      # live and geese-basement moved to stega.now, modulo to its own
      # subdomain, and sonic-pixels is retired outright. These paths were
      # linked from anothermachine.info and have been shared, so they forward
      # rather than 404 — GitHub Pages has no _redirects equivalent, so they
      # are real pages with a meta refresh and a canonical link.
      - run: cp -R ./redirects/stega ./site/stega
      - run: cp -R ./redirects/live ./site/live
      - run: cp -R ./redirects/geese-basement ./site/geese-basement
      - run: cp -R ./redirects/modulo ./site/modulo
      - run: cp -R ./redirects/sonic-pixels ./site/sonic-pixels

      # Publishing the codec bundle at amplib.app/lib/stegassette.js.
      # This is how the library distributes itself to the static sites that
      # cannot consume an ESM package: stega.now, its galleries, and the lab's
      # editor all load the codec with a plain <script src>. Consumers vendor a
      # copy and verify it against this URL — see docs/stegassette-consolidation.md.
      - run: npm i
        working-directory: packages/amplib-steganography
      - run: npm run build
        working-directory: packages/amplib-steganography
      - run: mkdir -p ./site/lib
      - run: cp ./packages/amplib-steganography/dist/stegassette.global.js ./site/lib/stegassette.js
      # The job schema ships separately: the editor and batch runner need it,
      # the player and galleries do not, so it stays out of the codec bundle.
      - run: cp ./packages/amplib-steganography/dist/jobSchema.global.js ./site/lib/stegassette-jobs.js
      # The Node build, for consumers that run outside a browser (the jobs
      # pipeline). ESM, with fs/pngjs left external — vendored the same way the
      # browser bundles are, rather than pulled from a registry at runtime.
      - run: cp ./packages/amplib-steganography/dist/node.js ./site/lib/stegassette-node.js
      - run: cp ./packages/amplib-steganography/dist/jobSchema.js ./site/lib/stegassette-jobs.mjs
      # A version-stamped copy alongside it, so a consumer can pin one build
      # while `stegassette.js` keeps tracking the latest.
      #
      # The codec and the job schema carry SEPARATE versions because they
      # change for separate reasons. Stamping the schema with CODEC_VERSION
      # meant a schema-only change rewrote an already-published pin — see
      # SCHEMA_VERSION in src/jobSchema.js.
      - name: Publish version-stamped copies
        run: |
          V=$(node --input-type=module -e "import('./packages/amplib-steganography/dist/node.js').then(m => process.stdout.write(m.Stegassette.CODEC_VERSION))")
          S=$(node --input-type=module -e "import('./packages/amplib-steganography/dist/jobSchema.js').then(m => process.stdout.write(m.SCHEMA_VERSION))")
          echo "codec version: $V    schema version: $S"
          cp ./site/lib/stegassette.js "./site/lib/stegassette-$V.js"
          cp ./site/lib/stegassette-node.js "./site/lib/stegassette-node-$V.js"
          cp ./site/lib/stegassette-jobs.js "./site/lib/stegassette-jobs-$S.js"
          cp ./site/lib/stegassette-jobs.mjs "./site/lib/stegassette-jobs-$S.mjs"

      # Superseded pins, carried forward. The stamping above only ever writes
      # the CURRENT version, and a Pages deploy replaces the whole site — so
      # the first bump of CODEC_VERSION silently 404'd the previous stamped
      # files. That is the same broken promise as changing their bytes, just
      # louder, and the check below could not see it because it only compares
      # files this build produces.
      #
      # Same pattern as ./redirects: committed bytes, copied into the site.
      # When a version is bumped, the outgoing build's stamped files belong
      # here. Never delete or edit anything in this directory.
      - run: cp -R ./lib-pins/. ./site/lib/

      # A pin is a promise: these bytes, forever. Republishing a stamped file
      # with different content breaks that quietly — nothing 404s, nothing
      # warns, the consumer just gets a different library than the one it
      # verified. So compare every stamped file against what is already live
      # and fail the deploy rather than overwrite. The fix when this fires is
      # always to bump the version, never to delete the check.
      - name: A published pin must never change meaning
        run: |
          fail=0
          shopt -s nullglob
          for f in ./site/lib/*-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*; do
            name=$(basename "$f")
            live=$(mktemp)
            code=$(curl -sS -o "$live" -w '%{http_code}' "https://amplib.app/lib/$name" || echo 000)
            if [ "$code" = "200" ]; then
              if cmp -s "$f" "$live"; then
                echo "ok        $name (unchanged)"
              else
                echo "PIN MOVED $name is already published with different bytes — bump the version"
                fail=1
              fi
            elif [ "$code" = "404" ]; then
              echo "new       $name"
            else
              echo "warn      $name — could not check (HTTP $code), not treating as a failure"
            fi
          done
          exit $fail

      # The other half of the same promise: a pin must not DISAPPEAR. The check
      # above walks the files this build produces, so it is structurally blind
      # to one going missing — which is exactly how bumping CODEC_VERSION
      # dropped stegassette-2026.07.31.js on 2026-08-01. This walks the other
      # direction: everything currently live must still be in the artifact.
      # The fix when this fires is to copy the missing file into ./lib-pins,
      # never to skip the check.
      - name: A published pin must never disappear
        run: |
          fail=0
          for name in $(ls ./lib-pins 2>/dev/null || true); do
            if [ -f "./site/lib/$name" ]; then
              echo "kept      $name"
            else
              echo "PIN LOST  $name is archived in ./lib-pins but missing from the build"
              fail=1
            fi
          done
          exit $fail

      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"
      - name: Deploy Docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
