# Simple workflow for deploying static content to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # compiling docs which is our homepage
      #
      # Packages with their own runtime dependencies need installing before the
      # docs build, because docs imports package SOURCE rather than a built
      # artifact — so Parcel resolves their imports from their own node_modules.
      # A package that gains a dependency and is not listed here fails the
      # deploy, not the local build, where node_modules is already populated.
      - run: npm i
        working-directory: packages/amplib-sound-transformation
      - run: npm i
        working-directory: packages/amplib-cosmos
      # sound-synthesis depends on @amplib/music-theory from npm rather than
      # inlining a copy of it — ChromaticWall takes a `Scale` as a parameter, so
      # a consumer holding both must hold the same one.
      - run: npm i
        working-directory: packages/amplib-sound-synthesis
      # music-detection does the same, for the same reason: DetectTone hands
      # back music-theory's `Note` and `Chord` instances.
      - run: npm i
        working-directory: packages/amplib-music-detection
      # photography depends on @amplib/devices for the camera rather than
      # calling getUserMedia itself — acquiring, enumerating and cycling a
      # camera is already solved there, and solved once.
      - run: npm i
        working-directory: packages/amplib-photography
      - run: npm i
      - run: npm i
        working-directory: docs
      - run: npm run build
        working-directory: docs

      # compiling lexicon-standoff
      - run: npm i
        working-directory: machines/lexicon-standoff
      - run: npm run build
        working-directory: machines/lexicon-standoff

      # compiling mindmeld
      - run: npm i
        working-directory: machines/mindmeld
      - run: npm run build
        working-directory: machines/mindmeld

      # renaming docs/dist to main site directory
      - run: mv ./docs/dist ./site
      # moving lexicon-standoff into site
      - run: mv ./machines/lexicon-standoff/dist ./site/lexicon-standoff
      # moving mindmeld into site
      - run: mv ./machines/mindmeld/dist ./site/mindmeld

      # live and geese-basement moved to stega.now, modulo to its own
      # subdomain, and sonic-pixels is retired outright. These paths were
      # linked from anothermachine.info and have been shared, so they forward
      # rather than 404 — GitHub Pages has no _redirects equivalent, so they
      # are real pages with a meta refresh and a canonical link.
      - run: cp -R ./redirects/stega ./site/stega
      - run: cp -R ./redirects/live ./site/live
      - run: cp -R ./redirects/geese-basement ./site/geese-basement
      - run: cp -R ./redirects/modulo ./site/modulo
      - run: cp -R ./redirects/sonic-pixels ./site/sonic-pixels

      # No codec bundles are published here any more. amplib.app/lib/ served
      # stegassette.js and friends so no-build pages could load the codec with
      # a plain <script src>, and every consumer has since moved to npm:
      # stega.now vendors from node_modules, stegassette-jobs imports the
      # package, omnichord pins unpkg URLs in an importmap. No page on
      # amplib.app ever loaded them. Removed 2026-08-01 along with the
      # version-stamped pins.
      #
      # For a no-build page that wants the browser global, the URL is
      # https://unpkg.com/@amplib/steganography@<version>/dist/stegassette.global.js
      # — immutable, which the old unversioned URL never was.
      #
      # This also dropped the package's npm i + build from this workflow: docs
      # imports package *source*, so nothing here needs dist.

      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"
      - name: Deploy Docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
