<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sonic Pixels has been retired</title>
    <!-- Sonic Pixels was an audio player using images as the file format. It
         was built and served from here, at amplib.app/sonic-pixels, so unlike
         the machines that simply left, this path was live and has been shared.
         The idea it was reaching for is what stega.now does now, so this
         forwards there rather than 404s. -->
    <meta http-equiv="refresh" content="0; url=https://stega.now/" />
    <link rel="canonical" href="https://stega.now/" />
    <meta name="robots" content="noindex" />
    <style>
      body { background:#000; color:#eee; font:14px/1.6 ui-monospace,monospace;
             display:grid; place-items:center; min-height:100vh; margin:0; }
      a { color:#8cf; }
    </style>
  </head>
  <body>
    <p>Sonic Pixels is retired. Its idea lives on at <a href="https://stega.now/">https://stega.now/</a>.</p>
  </body>
</html>
