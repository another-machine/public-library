<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmos | another machine</title>
    <style>
      @import "../amplib-docs.css";
    </style>
  </head>
  <body>
    <header class="masthead">
      <h1>Cosmos</h1>
      <div class="ht-arrange-row">
        <a href="/">another machine</a>
        <a
          href="https://github.com/another-machine/public-library/tree/main/packages/amplib-cosmos"
          >GitHub &#8599;</a
        >
      </div>
    </header>

    <main class="doc">
      <section>
        <h2>generate</h2>
        <p class="ht-type-prose u-dim">
          Cosmos provides astronomical data for a given time and location.
        </p>
        <p class="signature">
          generate({ latitude: number; longitude: number; timestamp: number; })
        </p>

        <div class="ht-arrange-sidebar">
          <div class="ht-arrange-stack">
            <pre class="code">generate({
  latitude: <span data-value="latitude"></span>,
  longitude: <span data-value="longitude"></span>,
  timestamp: <span data-output="date-output" data-inline></span>
});</pre>

            <pre class="code"><span data-output="report-output"></span></pre>
          </div>

          <form class="fieldset-stack"></form>
        </div>
      </section>
    </main>

    <script type="module">
      import { example } from "./app.ts";
      example();
    </script>
  </body>
</html>
