<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>music-composition | another machine</title>
    <style>
      @import "../amplib-docs.css";
    </style>
  </head>
  <body>
    <header class="masthead">
      <h1>amplib/<wbr />music-composition</h1>
      <div class="ht-arrange-row">
        <a href="/">another machine</a>
        <a
          href="https://github.com/another-machine/public-library/tree/main/packages/amplib-music-composition"
          >GitHub &#8599;</a
        >
      </div>
    </header>

    <main class="doc">
      <section>
        <h2>VoiceGenerator</h2>
        <p class="ht-type-prose u-dim">Create a random voice.</p>
        <p class="signature">new VoiceGenerator({ random: () => number })</p>
        <pre class="code">Ensemble.generateEnsemble({ selector: Math.random });
<span data-output="ensemble"></span></pre>
      </section>
    </main>

    <script type="module">
      import {
        Ensemble,
        ProceduralMusicApp,
      } from "../../../packages/amplib-music-composition/src";

      example();

      async function example() {
        const output = document.querySelector('[data-output="ensemble"]');
        update();

        async function update() {
          const result = ProceduralMusicApp.generateMusic();
          output.innerHTML = JSON.stringify(result, null, 2);
        }
      }
    </script>
  </body>
</html>
