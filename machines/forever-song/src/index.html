<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forever Song</title>
    <style>
      :root {
        --bg: #0c0e10;
        --bg-panel: #0f1214;
        --fg: #c8cdd2;
        --fg-dim: #48515a;
        --fg-muted: #6b7580;
        --sep: #1e2429;
        --accent: #4fa3f7;
        --c-main: #6ea8fe;
        --c-twinkle: #f8c94b;
        --c-bass: #3dd68c;
        --c-pad: #b88ef7;
        --c-arpeggios: #ff8866;
        --font:
          "Cascadia Code", "Fira Code", "JetBrains Mono", "Menlo",
          "Courier New", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--fg);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        font-size: 12px;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      #main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ── Stream column ── */
      #stream-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--sep);
      }

      #legend {
        display: flex;
        gap: 16px;
        padding: 6px 16px;
        border-bottom: 1px solid var(--sep);
        background: var(--bg-panel);
        flex-shrink: 0;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--fg-muted);
      }
      .legend-dot {
        font-size: 9px;
      }
      .legend-dot.main {
        color: var(--c-main);
      }
      .legend-dot.twinkle {
        color: var(--c-twinkle);
      }
      .legend-dot.bass {
        color: var(--c-bass);
      }

      #stream {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
        font-size: 11px;
        line-height: 1.65;
      }

      .s-line {
        display: flex;
        padding: 0 16px;
        white-space: pre;
      }
      .s-line.dim {
        opacity: 0.25;
      }

      .s-addr {
        width: 8ch;
        color: var(--fg-dim);
        flex-shrink: 0;
      }

      .s-voices {
        display: flex;
      }

      .s-voice {
        width: 7ch;
        display: inline-block;
      }
      .s-voice.hit-main {
        color: var(--c-main);
      }
      .s-voice.hit-twinkle {
        color: var(--c-twinkle);
      }
      .s-voice.hit-bass {
        color: var(--c-bass);
      }
      .s-voice.silent {
        color: var(--fg-dim);
      }

      .s-ann {
        padding: 1px 16px;
        color: var(--fg-muted);
        font-style: italic;
        font-size: 11px;
      }

      .s-sep {
        padding: 2px 16px;
        color: var(--fg-dim);
        font-size: 11px;
      }

      /* ── Panel ── */
      #panel {
        width: 240px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        background: var(--bg-panel);
        padding: 16px 14px;
        gap: 0;
      }

      .p-section {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 10px 0;
      }

      .p-label {
        text-transform: uppercase;
        font-size: 9px;
        letter-spacing: 0.1em;
        color: var(--fg-dim);
        margin-bottom: 2px;
      }

      .p-val {
        color: var(--fg);
        font-size: 12px;
      }
      .p-val.large {
        font-size: 17px;
        font-weight: 600;
      }
      .p-sub {
        font-size: 11px;
        color: var(--fg-muted);
      }

      .p-meter {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .tag {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--sep);
        border-radius: 2px;
        padding: 1px 5px;
        font-size: 11px;
        color: var(--fg);
      }

      .p-sep {
        height: 1px;
        background: var(--sep);
        flex-shrink: 0;
        margin: 2px 0;
      }

      .p-planets {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-top: 2px;
      }

      .p-planet {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
      }
      .p-planet .sym {
        color: var(--fg-muted);
        width: 1.5ch;
      }
      .p-planet .name {
        color: var(--fg-muted);
        flex: 1;
      }
      .p-planet .alt {
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }
      .p-planet .alt.above {
        color: var(--c-main);
      }
      .p-planet .alt.below {
        color: var(--fg-dim);
      }

      .p-voice-dynamic {
        margin: 5px 0;
        font-size: 11px;
      }
      .p-voice-dynamic-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 2px;
        color: var(--fg-muted);
      }
      .p-voice-dynamic-bar {
        height: 4px;
        background: rgba(200, 205, 210, 0.08);
        border-radius: 1px;
        overflow: hidden;
      }
      .p-voice-dynamic-fill {
        height: 100%;
        border-radius: 1px;
        transition: width 3s ease;
      }
      .p-voice-dynamic-fill.main {
        background: var(--c-main);
      }
      .p-voice-dynamic-fill.twinkle {
        background: var(--c-twinkle);
      }
      .p-voice-dynamic-fill.bass {
        background: var(--c-bass);
      }

      #p-map {
        width: 100%;
        max-width: 212px;
        height: 110px;
        background: rgba(79, 163, 247, 0.05);
        border: 1px solid var(--sep);
        border-radius: 2px;
        cursor: crosshair;
        margin-top: 4px;
      }
      #p-coords {
        font-size: 10px;
        color: var(--fg-muted);
        margin-top: 4px;
      }

      #p-celestial {
        width: 100%;
        max-width: 212px;
        height: 140px;
        background: rgba(79, 163, 247, 0.05);
        border: 1px solid var(--sep);
        border-radius: 2px;
        margin-top: 8px;
      }

      /* ── Cmdbar ── */
      #cmdbar {
        border-top: 1px solid var(--sep);
        display: flex;
        align-items: center;
        padding: 0 16px;
        height: 38px;
        flex-shrink: 0;
        background: var(--bg-panel);
      }

      #prompt {
        color: var(--accent);
        user-select: none;
        flex-shrink: 0;
        padding-right: 6px;
      }
      #cmd-display {
        flex: 1;
        color: var(--fg);
        display: flex;
        align-items: center;
      }
      #cmd-text {
        white-space: pre;
      }

      #cursor {
        display: inline-block;
        width: 7px;
        height: 14px;
        background: var(--accent);
        vertical-align: middle;
        animation: blink 1.1s step-end infinite;
        flex-shrink: 0;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      #cmd-input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }

      /* ── Bottom bar ── */
      #bottombar {
        border-top: 1px solid var(--sep);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 16px;
        height: 24px;
        background: rgba(255, 255, 255, 0.015);
        font-size: 11px;
        color: var(--fg-dim);
        flex-shrink: 0;
        letter-spacing: 0.05em;
      }
      #bottombar .bb-left {
        display: flex;
        gap: 16px;
      }
      #bottombar .bb-item {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      #bottombar .bb-val {
        color: var(--fg-muted);
      }

      #sync-indicator {
        display: none;
        color: var(--c-twinkle);
        animation: pulse 0.6s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        from {
          opacity: 0.5;
        }
        to {
          opacity: 1;
        }
      }

      ::-webkit-scrollbar {
        width: 3px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--sep);
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="main">
        <div id="stream-col">
          <div id="legend">
            <div class="legend-item">
              <span class="legend-dot main">&#9670;</span><span>melodic</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot twinkle">&#9670;</span
              ><span>twinkle</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot bass">&#9679;</span><span>bass</span>
            </div>
          </div>
          <div id="stream"></div>
        </div>

        <div id="panel">
          <div class="p-section">
            <div class="p-label">key</div>
            <div class="p-val large" id="p-key">&#8212;</div>
            <div class="p-sub" id="p-mode-desc">&#8212;</div>
          </div>

          <div class="p-sep"></div>

          <div class="p-section">
            <div class="p-label">meter &middot; tempo</div>
            <div class="p-meter">
              <span class="tag" id="p-meter">&#8212;</span>
              <span class="tag" id="p-bpm">&#8212;</span>
            </div>
          </div>

          <div class="p-sep"></div>

          <div class="p-section">
            <div class="p-label">dynamics</div>
            <div class="p-voice-dynamic">
              <div class="p-voice-dynamic-label">
                <span style="color: var(--c-main)">melodic</span>
                <span id="p-main-dyn">&#8212;</span>
              </div>
              <div class="p-voice-dynamic-bar">
                <div
                  class="p-voice-dynamic-fill main"
                  id="p-main-dyn-fill"
                  style="width: 0%"
                ></div>
              </div>
            </div>
            <div class="p-voice-dynamic">
              <div class="p-voice-dynamic-label">
                <span style="color: var(--c-twinkle)">twinkle</span>
                <span id="p-twinkle-dyn">&#8212;</span>
              </div>
              <div class="p-voice-dynamic-bar">
                <div
                  class="p-voice-dynamic-fill twinkle"
                  id="p-twinkle-dyn-fill"
                  style="width: 0%"
                ></div>
              </div>
            </div>
            <div class="p-voice-dynamic">
              <div class="p-voice-dynamic-label">
                <span style="color: var(--c-bass)">bass</span>
                <span id="p-bass-dyn">&#8212;</span>
              </div>
              <div class="p-voice-dynamic-bar">
                <div
                  class="p-voice-dynamic-fill bass"
                  id="p-bass-dyn-fill"
                  style="width: 0%"
                ></div>
              </div>
            </div>
            <div class="p-sub" id="p-tension">&#8212;</div>
          </div>

          <div class="p-sep"></div>

          <div class="p-section">
            <div class="p-label">sky</div>
            <div class="p-val" id="p-sky">&#8212;</div>
            <div class="p-val" id="p-moon">&#8212;</div>
          </div>

          <div class="p-section">
            <div class="p-label">planets</div>
            <div class="p-planets" id="p-planets"></div>
          </div>

          <div class="p-sep"></div>

          <div class="p-section">
            <div class="p-label">location</div>
            <div class="p-sub" id="p-location">&#8212;</div>
            <canvas id="p-map" width="212" height="110"></canvas>
            <div id="p-coords">&#8212;</div>
            <canvas id="p-celestial" width="212" height="140"></canvas>
          </div>

          <div class="p-section" id="p-sim-section" style="display: none">
            <div class="p-label">simulated time</div>
            <div class="p-sub" id="p-simdate">&#8212;</div>
          </div>
        </div>
      </div>

      <div id="cmdbar" tabindex="0">
        <span id="prompt">&#8250;</span>
        <div id="cmd-display">
          <span id="cmd-text"></span><span id="cursor"></span>
        </div>
        <input
          id="cmd-input"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </div>

      <div id="bottombar">
        <div class="bb-left">
          <div class="bb-item"><span id="bb-key">forever song</span></div>
          <div class="bb-item">
            <span id="bb-meter" class="bb-val">&#8212;</span>
          </div>
          <div class="bb-item">
            <span id="bb-bpm" class="bb-val">&#8212;</span>
          </div>
          <div class="bb-item" id="sync-indicator">&#8635; syncing</div>
        </div>
        <div class="bb-item">
          <span class="bb-val">start / stop / offset / sync / help</span>
        </div>
      </div>
    </div>

    <script type="module">
      import { generate } from "../../../packages/amplib-cosmos/src/index";
      import {
        ChromaticWall,
        Clock,
      } from "../../../packages/amplib-sound-synthesis/src/index";
      import {
        Scale,
        Note,
      } from "../../../packages/amplib-music-theory/src/index";

      // ═══ SEEDED RNG ═══════════════════════════════════════════════════════════
      function withSeededRandom(seed, fn) {
        const orig = Math.random;
        let s = (seed ^ 0xdeadbeef) >>> 0 || 1;
        Math.random = () => {
          s ^= s << 13;
          s ^= s >> 17;
          s ^= s << 5;
          return (s >>> 0) / 4294967296;
        };
        const result = fn();
        Math.random = orig;
        return result;
      }

      // ═══ STATE ════════════════════════════════════════════════════════════════
      let lat = 40.7128,
        lon = -74.006;
      let timeOffset = 0;
      let metronomeEnabled = false;
      let wallBeatIndex = 0;
      let cachedCosmos = null;
      let lastCosmosTs = 0;
      let lastUIUpdate = 0;
      let lastBpm = 90;
      let bar = 0;
      let beatStep = 0;

      const beatHistory = [];
      const MAX_BEATS = 10000;
      const MAX_STREAM = 500;

      // ═══ LAZY AUDIO INIT ══════════════════════════════════════════════════════
      // AudioContext must only be created on a user gesture (autoplay policy).
      let audioCtx = null;
      let wall = null;
      let clock = null;
      let metroOsc = null;
      let metroGain = null;
      let audioBaseline = null; // { perf, ctx } — maps performance.now() → audioCtx.currentTime

      function initAudio() {
        if (audioCtx) return; // already initialised

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // Capture baseline immediately so we can map performance.now() → audioCtx.currentTime
        audioBaseline = { perf: performance.now(), ctx: audioCtx.currentTime };

        wall = new ChromaticWall({
          audioContext: audioCtx,
          volume: 0.75,
          mainChance: 0.5,
          twinkleChance: 0.5,
        });

        clock = new Clock({ subdivision: 16 });

        // Metronome (oscillator started after AudioContext is alive)
        metroOsc = audioCtx.createOscillator();
        metroGain = audioCtx.createGain();
        metroGain.gain.value = 0;
        metroOsc.frequency.value = 880;
        metroOsc.type = "sine";
        metroOsc.connect(metroGain);
        metroGain.connect(audioCtx.destination);
        metroOsc.start();

        clock.onBeat(beatCallback);
      }

      // ═══ COSMOS HELPERS ═══════════════════════════════════════════════════════
      function getPlanet(c, name) {
        if (name === "sun") {
          const el = c.sun.elevation.value;
          return { alt: el, az: c.sun.azimuth.value, visible: el > -18 };
        }
        if (name === "moon") {
          const alt = c.moon.altitude?.value ?? -90;
          return { alt, az: c.moon.azimuth?.value ?? 0, visible: alt > -5 };
        }
        const p = c.planets[name];
        if (!p) return { alt: -90, az: 0, visible: false };
        const alt = p.altitude?.value;
        const az = p.azimuth?.value;
        return {
          alt: typeof alt === "number" && isFinite(alt) ? alt : -90,
          az: typeof az === "number" && isFinite(az) ? az : 0,
          visible: !!p.isVisible?.value,
        };
      }

      const PLANET_SYMS = [
        ["sun", "\u2609"],
        ["moon", "\u263d"],
        ["venus", "\u2640"],
        ["mars", "\u2642"],
        ["jupiter", "\u2643"],
        ["saturn", "\u2644"],
        ["mercury", "\u263f"],
      ];

      // ═══ PLANETARY WEIGHTS ════════════════════════════════════════════════════
      function generatePlanetaryWeights(c) {
        const w = [0.5, 0.3, 0.4, 0.6, 0.7, 0.4, 0.2];

        const sunElev = c.sun.elevation.value;
        const sunInf = Math.max(0, sunElev / 90);
        w[0] += sunInf * 0.8;
        w[3] += sunInf * 0.6;
        w[4] += sunInf * 0.7;

        const moonPhase = c.moon.phase.value;
        const waxing = moonPhase < 0.5 ? moonPhase * 2 : (1 - moonPhase) * 2;
        w[1] -= waxing * 0.4;
        w[2] += waxing * 0.3;
        w[5] += waxing * 0.2;
        w[0] += Math.max(0, (c.moon.altitude?.value ?? 0) / 90) * 0.3;

        const venus = getPlanet(c, "venus");
        if (venus.visible) {
          const v = Math.max(0, venus.alt / 90) * 0.6;
          w[2] += v * 0.5;
          w[5] += v * 0.6;
        }
        const mars = getPlanet(c, "mars");
        if (mars.visible) w[4] += Math.max(0, mars.alt / 90) * 0.6 * 0.4;

        const jup = getPlanet(c, "jupiter");
        if (jup.visible) {
          const j = Math.max(0, jup.alt / 90) * 0.6;
          w[3] += j * 0.5;
          w[4] += j * 0.3;
        }
        const sat = getPlanet(c, "saturn");
        if (sat.visible) {
          const s = Math.max(0, sat.alt / 90) * 0.6;
          w[0] += s * 0.3;
          w[3] += s * 0.4;
        }

        const total = w.reduce((a, b) => a + Math.max(0, b), 0);
        return total > 0
          ? w.map((v) => Math.max(0, v) / total)
          : w.map(() => 1 / 7);
      }

      function selectIntervalFromWeights(weights) {
        const r = Math.random();
        let sum = 0;
        for (let i = 0; i < weights.length; i++) {
          sum += weights[i];
          if (r < sum) return i;
        }
        return weights.length - 1;
      }

      function computeTension(weights) {
        const mean = 1 / weights.length;
        const variance =
          weights.reduce((s, w) => s + Math.pow(w - mean, 2), 0) /
          weights.length;
        return Math.sqrt(variance) / mean;
      }

      // ═══ SCALE SELECTION ══════════════════════════════════════════════════════
      const SCALE_POOLS = [
        { key: "C", mode: "minor" },
        { key: "G", mode: "minor" },
        { key: "D", mode: "minor" },
      ];
      function getScalePool(c) {
        const raw = c.planets.venus?.heliocentricAngle?.value;
        const ang = typeof raw === "number" && isFinite(raw) ? raw : 0;
        return SCALE_POOLS[Math.floor((ang / 360) * 3) % 3];
      }

      // ═══ BASS VOICE ═══════════════════════════════════════════════════════════
      const BASS_ROOTS = { C: ["C", "G"], G: ["G", "D"], D: ["D", "A"] };

      function triggerBass(pool, moonPhase, phasedIdx, brightness) {
        const roll = withSeededRandom(phasedIdx + 1000000, () => Math.random());
        const fireChance = 0.25 + (1 - brightness) * 0.2;
        if (roll > fireChance) return null;

        const roots = BASS_ROOTS[pool.key] || ["C", "G"];
        const notation =
          roots[Math.floor(moonPhase * roots.length) % roots.length];
        const octave = 2;
        const freq =
          Note.octaveStepFrequencies[octave]?.[Note.notationIndex(notation)];
        if (!freq || !isFinite(freq)) return null;

        const osc = audioCtx.createOscillator();
        const modOsc = audioCtx.createOscillator();
        const modGain = audioCtx.createGain();
        const env = audioCtx.createGain();
        const lp = audioCtx.createBiquadFilter();
        const pan = audioCtx.createStereoPanner();

        osc.type = "sawtooth";
        osc.frequency.value = freq;
        modOsc.type = "sine";
        modOsc.frequency.value = 60;
        modGain.gain.value = freq * 0.015;
        lp.type = "lowpass";
        lp.frequency.value = 520;
        lp.Q.value = 0.7;
        pan.pan.value = 0;

        const release = brightness < 0.3 ? 1.8 : 1.0;
        env.gain.setValueAtTime(0, audioCtx.currentTime);
        env.gain.linearRampToValueAtTime(0.28, audioCtx.currentTime + 0.04);
        env.gain.linearRampToValueAtTime(
          0,
          audioCtx.currentTime + 0.04 + release,
        );

        modOsc.connect(modGain);
        modGain.connect(osc.detune);
        osc.connect(env);
        env.connect(lp);
        lp.connect(pan);
        pan.connect(audioCtx.destination);

        osc.onended = () => {
          osc.disconnect();
          modOsc.disconnect();
          modGain.disconnect();
          env.disconnect();
          lp.disconnect();
          pan.disconnect();
        };
        modOsc.start();
        osc.start();
        modOsc.stop(audioCtx.currentTime + 0.04 + release);
        osc.stop(audioCtx.currentTime + 0.04 + release);

        return notation + octave;
      }

      // ═══ CANVAS ═══════════════════════════════════════════════════════════════
      const mapCanvas = document.getElementById("p-map");
      const celestialCanvas = document.getElementById("p-celestial");
      const mapCtx = mapCanvas.getContext("2d");
      const celCtx = celestialCanvas.getContext("2d");

      function drawMap(c) {
        const w = mapCanvas.width,
          h = mapCanvas.height;
        mapCtx.clearRect(0, 0, w, h);

        mapCtx.strokeStyle = "rgba(79,163,247,0.12)";
        mapCtx.lineWidth = 1;
        mapCtx.beginPath();
        mapCtx.moveTo(0, h / 2);
        mapCtx.lineTo(w, h / 2);
        mapCtx.stroke();
        mapCtx.beginPath();
        mapCtx.moveTo(w / 2, 0);
        mapCtx.lineTo(w / 2, h);
        mapCtx.stroke();

        const PLANET_MAP = [
          ["venus", "\u2640"],
          ["mars", "\u2642"],
          ["jupiter", "\u2643"],
          ["saturn", "\u2644"],
          ["mercury", "\u263f"],
        ];
        for (const [name, sym] of PLANET_MAP) {
          const p = c.planets[name];
          if (!p) continue;
          const x = ((p.heliocentricAngle?.value ?? 0) / 360) * w;
          const y = h * 0.5 - (p.altitude.value / 90) * (h * 0.42);
          mapCtx.fillStyle = p.isVisible.value
            ? "rgba(79,163,247,0.7)"
            : "rgba(79,163,247,0.2)";
          mapCtx.font = "9px monospace";
          mapCtx.textAlign = "center";
          mapCtx.textBaseline = "middle";
          mapCtx.fillText(sym, x, Math.max(6, Math.min(h - 4, y)));
        }

        const ox = ((lon + 180) / 360) * w;
        const oy = ((90 - lat) / 180) * h;
        mapCtx.fillStyle = "rgba(79,163,247,0.9)";
        mapCtx.beginPath();
        mapCtx.arc(ox, oy, 3, 0, Math.PI * 2);
        mapCtx.fill();
      }

      function drawCelestial(c) {
        const w = celestialCanvas.width,
          h = celestialCanvas.height;
        celCtx.clearRect(0, 0, w, h);

        const cx = w / 2,
          cy = h / 2;
        const R = Math.min(cx, cy) * 0.82;

        // altitude rings at 60°, 30°, and horizon (0°)
        const altRings = [
          { alt: 60, opacity: 0.1 },
          { alt: 30, opacity: 0.1 },
          { alt: 0, opacity: 0.35 },
        ];
        for (const { alt, opacity } of altRings) {
          const r = R * Math.cos((alt * Math.PI) / 180);
          celCtx.strokeStyle = "rgba(79,163,247," + opacity + ")";
          celCtx.lineWidth = alt === 0 ? 1.5 : 1;
          celCtx.beginPath();
          celCtx.arc(cx, cy, r, 0, Math.PI * 2);
          celCtx.stroke();
          if (alt > 0) {
            celCtx.fillStyle = "rgba(79,163,247,0.2)";
            celCtx.font = "8px monospace";
            celCtx.textAlign = "left";
            celCtx.textBaseline = "middle";
            celCtx.fillText(alt + "°", cx + r + 2, cy);
          }
        }

        // horizon label
        celCtx.fillStyle = "rgba(79,163,247,0.25)";
        celCtx.font = "8px monospace";
        celCtx.textAlign = "left";
        celCtx.textBaseline = "middle";
        celCtx.fillText("horizon", cx + R + 2, cy);

        // cardinal labels
        celCtx.fillStyle = "rgba(79,163,247,0.5)";
        celCtx.font = "9px monospace";
        celCtx.textAlign = "center";
        celCtx.textBaseline = "middle";
        celCtx.fillText("N", cx, cy - R - 7);
        celCtx.fillText("S", cx, cy + R + 7);
        celCtx.fillText("E", cx + R + 7, cy - 10);
        celCtx.fillText("W", cx - R - 7, cy - 10);

        for (const [name, sym] of PLANET_SYMS) {
          const pd = getPlanet(c, name);
          if (pd.alt < -20) continue;
          const altRad = (pd.alt * Math.PI) / 180;
          const azRad = (pd.az * Math.PI) / 180;
          const d = R * Math.cos(altRad);
          const x = cx + d * Math.sin(azRad);
          const y = cy - d * Math.cos(azRad);
          const color =
            name === "sun"
              ? "#f8c94b"
              : name === "moon"
                ? "#c8cdd2"
                : pd.alt > 0
                  ? "rgba(79,163,247,0.85)"
                  : "rgba(79,163,247,0.25)";
          celCtx.fillStyle = color;
          celCtx.font = "11px monospace";
          celCtx.textAlign = "center";
          celCtx.textBaseline = "middle";
          celCtx.fillText(sym, x, y);
          // name label below symbol
          celCtx.font = "7px monospace";
          celCtx.fillStyle =
            pd.alt > 0 ? "rgba(79,163,247,0.55)" : "rgba(79,163,247,0.18)";
          celCtx.fillText(name, x, y + 9);
        }
      }

      // ═══ MAP CLICK → LAT/LON ═══════════════════════════════════════════════════
      mapCanvas.addEventListener("click", function (e) {
        const rect = mapCanvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const w = mapCanvas.width;
        const h = mapCanvas.height;
        lon = (x / w) * 360 - 180;
        lat = 90 - (y / h) * 180;
        cachedCosmos = null;
        const latStr =
          Math.abs(lat).toFixed(2) + "\u00b0" + (lat >= 0 ? "N" : "S");
        const lonStr =
          Math.abs(lon).toFixed(2) + "\u00b0" + (lon >= 0 ? "E" : "W");
        appendAnn("location: " + latStr + "  " + lonStr);
      });

      // ═══ STATUS PANEL ═════════════════════════════════════════════════════════
      const INTERVAL_LABELS = ["I", "II", "III", "IV", "V", "VI", "VII"];

      function dynLabel(brightness) {
        return brightness < 0.1
          ? "ppp"
          : brightness < 0.25
            ? "pp"
            : brightness < 0.45
              ? "p"
              : brightness < 0.6
                ? "mp"
                : brightness < 0.75
                  ? "mf"
                  : brightness < 0.9
                    ? "f"
                    : "ff";
      }

      function renderStatus(c, pool, bpm, tension, intervalIdx) {
        const sunElev = c.sun.elevation.value;
        const brightness = Math.max(0, Math.min(1, (sunElev + 18) / 108));
        const moonPhase = c.moon.phase.value;
        const moonDesc = c.moon.phaseDescription?.value ?? "";
        const tensionLbl =
          tension < 0.3 ? "consonant" : tension < 0.6 ? "mild" : "tense";
        const dyn = dynLabel(brightness);
        const sign = sunElev >= 0 ? "+" : "";

        document.getElementById("p-key").textContent =
          pool.key + " " + pool.mode;
        document.getElementById("p-mode-desc").textContent =
          "interval " +
          (INTERVAL_LABELS[intervalIdx] ?? "?") +
          "  \u00b7  " +
          tensionLbl;
        document.getElementById("p-meter").textContent = "4/4";
        document.getElementById("p-bpm").textContent =
          Math.round(bpm) + " \u2669";

        const lvl = brightness * 100;
        document.getElementById("p-main-dyn").textContent = dyn;
        document.getElementById("p-main-dyn-fill").style.width = lvl + "%";
        document.getElementById("p-twinkle-dyn").textContent = dyn;
        document.getElementById("p-twinkle-dyn-fill").style.width = lvl + "%";
        document.getElementById("p-bass-dyn").textContent = dyn;
        document.getElementById("p-bass-dyn-fill").style.width = lvl + "%";
        document.getElementById("p-tension").textContent =
          "tension " + tension.toFixed(2);

        document.getElementById("p-sky").textContent =
          "\u2600 " + sign + sunElev.toFixed(1) + "\u00b0";
        document.getElementById("p-moon").textContent =
          moonDesc + "  " + Math.round(moonPhase * 100) + "%";

        const latStr =
          Math.abs(lat).toFixed(2) + "\u00b0" + (lat >= 0 ? "N" : "S");
        const lonStr =
          Math.abs(lon).toFixed(2) + "\u00b0" + (lon >= 0 ? "E" : "W");
        document.getElementById("p-location").textContent =
          latStr + "  " + lonStr;
        document.getElementById("p-coords").textContent =
          latStr + "  " + lonStr;

        const planetsEl = document.getElementById("p-planets");
        planetsEl.innerHTML = "";
        for (const [name, sym] of PLANET_SYMS.slice(2)) {
          const pd = getPlanet(c, name);
          const altCls = pd.alt >= 0 ? "above" : "below";
          const altSign = pd.alt >= 0 ? "+" : "";
          const row = document.createElement("div");
          row.className = "p-planet";
          row.innerHTML =
            '<span class="sym">' +
            sym +
            "</span>" +
            '<span class="name">' +
            name +
            "</span>" +
            '<span class="alt ' +
            altCls +
            '">' +
            altSign +
            pd.alt.toFixed(0) +
            "\u00b0</span>";
          planetsEl.appendChild(row);
        }

        document.getElementById("bb-key").textContent =
          pool.key + " " + pool.mode;
        document.getElementById("bb-meter").textContent = "4/4";
        document.getElementById("bb-bpm").textContent =
          Math.round(bpm) + " bpm";

        const b = Math.round(brightness * 18);
        const bb = Math.round(brightness * 28);
        document.body.style.background = "rgb(" + b + "," + b + "," + bb + ")";
        document.getElementById("root").style.background =
          "rgb(" + b + "," + b + "," + bb + ")";
      }

      // ═══ STREAM ═══════════════════════════════════════════════════════════════
      const streamEl = document.getElementById("stream");

      function appendStream(pool, intervalIdx, tension, bassLabel, fired) {
        const addr =
          String(bar).padStart(4, "0") +
          "." +
          String(beatStep).padStart(2, "0");
        const note = (INTERVAL_LABELS[intervalIdx] ?? "?").padEnd(3, " ");

        const mc = fired.main
          ? '<span class="s-voice hit-main">\u2666 ' + note + "</span>"
          : '<span class="s-voice silent">\u00b7      </span>';
        const tc = fired.twinkle
          ? '<span class="s-voice hit-twinkle">\u25c6      </span>'
          : '<span class="s-voice silent">\u00b7      </span>';
        const bc = fired.bass
          ? '<span class="s-voice hit-bass">\u25cf ' +
            (bassLabel || "").padEnd(3, " ") +
            "</span>"
          : '<span class="s-voice silent">\u00b7      </span>';

        const anyFired = fired.main || fired.twinkle || fired.bass;
        const line = document.createElement("div");
        line.className = "s-line" + (anyFired ? "" : " dim");
        line.innerHTML =
          '<span class="s-addr">' +
          addr +
          '  </span><span class="s-voices">' +
          mc +
          tc +
          bc +
          "</span>";
        streamEl.appendChild(line);
        streamEl.scrollTop = streamEl.scrollHeight;
        while (streamEl.children.length > MAX_STREAM)
          streamEl.removeChild(streamEl.firstChild);
      }

      function appendAnn(text) {
        const line = document.createElement("div");
        line.className = "s-ann";
        line.textContent = text;
        streamEl.appendChild(line);
        streamEl.scrollTop = streamEl.scrollHeight;
        while (streamEl.children.length > MAX_STREAM)
          streamEl.removeChild(streamEl.firstChild);
      }

      function appendSep() {
        const line = document.createElement("div");
        line.className = "s-sep";
        line.textContent = "\u2500".repeat(36);
        streamEl.appendChild(line);
        streamEl.scrollTop = streamEl.scrollHeight;
        while (streamEl.children.length > MAX_STREAM)
          streamEl.removeChild(streamEl.firstChild);
      }

      // ═══ SCORE EXPORT ═════════════════════════════════════════════════════════
      function exportScore(minutes) {
        minutes = minutes || 60;
        const now = Date.now() + timeOffset;
        const startTime = now - minutes * 60 * 1000;
        const beats = beatHistory.filter(function (b) {
          return b.timestamp >= startTime;
        });
        let md = "# Forever Song Export\n\n";
        md +=
          "**Period:** " +
          new Date(startTime).toUTCString() +
          " \u2192 " +
          new Date(now).toUTCString() +
          "\n";
        md += "**Beats captured:** " + beats.length + "\n\n";
        if (!beats.length) {
          md += "*No beats recorded.*\n";
          return md;
        }
        md +=
          "## Beat Log\n\n| Time | Key | Interval | Tension |\n|------|-----|----------|---------|\n";
        beats.slice(0, 500).forEach(function (b) {
          const t = new Date(b.timestamp).toUTCString().split(" ")[4];
          const tl =
            b.tension < 0.3 ? "consonant" : b.tension < 0.6 ? "mild" : "tense";
          md +=
            "| " +
            t +
            " | " +
            b.key +
            " | " +
            (INTERVAL_LABELS[b.intervalIdx] ?? "?") +
            " | " +
            tl +
            " |\n";
        });
        return md;
      }

      // ═══ BEAT CALLBACK ════════════════════════════════════════════════════════
      let lastStatusKey = "";

      function beatCallback(tickInfo) {
        // Schedule metronome click at the exact audio time the worker intended,
        // not at audioCtx.currentTime (which has JS-jitter baked in).
        if (metronomeEnabled && audioCtx && audioBaseline) {
          const workerPerf = tickInfo?.timestamp ?? performance.now();
          const audioAt = Math.max(
            audioCtx.currentTime,
            audioBaseline.ctx + (workerPerf - audioBaseline.perf) / 1000,
          );
          metroGain.gain.cancelScheduledValues(audioAt);
          metroGain.gain.setValueAtTime(0.12, audioAt);
          metroGain.gain.exponentialRampToValueAtTime(0.001, audioAt + 0.05);
        }

        const now = Date.now() + timeOffset;

        if (!cachedCosmos || now - lastCosmosTs > 3000) {
          try {
            cachedCosmos = generate({
              latitude: lat,
              longitude: lon,
              timestamp: now,
            });
          } catch (e) {
            appendAnn("cosmos error: " + e.message);
            return;
          }
          lastCosmosTs = now;
        }
        const c = cachedCosmos;

        const pool = getScalePool(c);
        const scale = new Scale({ root: pool.key, mode: pool.mode });

        const moonPhase = c.moon.phase.value;
        lastBpm = lastBpm + (70 + moonPhase * 30 - lastBpm) * 0.008;
        clock.setBPM(lastBpm);

        const beatMs = (60 / clock.bpm) * (4 / clock.subdivision) * 1000;
        const phasedIdx = Math.floor(now / beatMs);

        const weights = generatePlanetaryWeights(c);
        const intervalIdx = withSeededRandom(phasedIdx, function () {
          return selectIntervalFromWeights(weights);
        });
        const stepFactor =
          intervalIdx / Math.max(1, scale.intervals.length - 1);
        const tension = computeTension(weights);

        const sunElev = c.sun.elevation.value;
        const brightness = Math.max(0, Math.min(1, (sunElev + 18) / 108));

        const jupAlt = c.planets.jupiter?.altitude?.value ?? 0;
        const venAlt = c.planets.venus?.altitude?.value ?? 0;
        wall.synthMain.modulationDepth = 0.5 + Math.max(0, jupAlt / 90) * 2.5;
        wall.synthTwinkle.modulationDepth =
          0.5 + Math.max(0, venAlt / 90) * 2.0;
        wall.mainChance = Math.max(0.05, 0.5 - brightness * 0.4);
        wall.twinkleChance = 0.15 + brightness * 0.6;

        const fired = { main: false, twinkle: false, bass: false };
        withSeededRandom(phasedIdx + 500000, function () {
          const r = wall.tick({
            scale,
            stepFactor,
            highpassFactor: Math.max(
              0,
              (c.observer?.siderealTime?.unitRange ?? 0.05) * 0.3,
            ),
            lowpassFactor: 0.2 + brightness * 0.6,
            mainEnvelopeModifier: { release: brightness < 0.3 ? 4.0 : 0.8 },
            twinkleEnvelopeModifier: { release: 0.15 + brightness * 0.65 },
          });
          if (r) {
            fired.main = r.main;
            fired.twinkle = r.twinkle;
          }
        });

        const bassLabel = triggerBass(pool, moonPhase, phasedIdx, brightness);
        fired.bass = !!bassLabel;

        beatHistory.push({
          timestamp: now,
          key: pool.key,
          intervalIdx,
          tension,
          moonPhase,
        });
        if (beatHistory.length > MAX_BEATS) beatHistory.shift();

        const statusKey = pool.key + pool.mode;
        if (lastStatusKey !== statusKey) {
          lastStatusKey = statusKey;
          appendSep();
          appendAnn(
            pool.key +
              " " +
              pool.mode +
              "  \u00b7  " +
              Math.round(lastBpm) +
              " \u2669  \u00b7  " +
              dynLabel(brightness),
          );
        }

        beatStep++;
        if (beatStep >= 16) {
          beatStep = 0;
          bar++;
        }

        appendStream(pool, intervalIdx, tension, bassLabel, fired);

        if (now - lastUIUpdate > 180) {
          drawMap(c);
          drawCelestial(c);
          renderStatus(c, pool, clock.bpm, tension, intervalIdx);
          lastUIUpdate = now;
        }

        wallBeatIndex++;
      }

      // ═══ SYNC ═════════════════════════════════════════════════════════════════
      let syncArmed = false;
      let syncTarget = 0;
      const syncIndicator = document.getElementById("sync-indicator");

      function rafLoop() {
        if (syncArmed && clock) {
          syncIndicator.style.display = "";
          if (Date.now() >= syncTarget) {
            syncArmed = false;
            syncIndicator.style.display = "none";
            clock.stop();
            clock.start();
            appendAnn("sync fired \u2014 clocks restarted");
          }
        }
        requestAnimationFrame(rafLoop);
      }
      rafLoop();

      // ═══ COMMAND LINE ═════════════════════════════════════════════════════════
      const HELP_TEXT = [
        "start                 \u2014 begin playback",
        "stop                  \u2014 pause playback",
        "bpm <n>               \u2014 override tempo (auto: 70\u2013100, moon-driven)",
        "offset <days>         \u2014 shift time by N days from now (e.g. offset 30)",
        "set <date>            \u2014 set absolute time (e.g. set 2025-06-21)",
        "location <lat> <lon>  \u2014 set observer coordinates",
        "export [min]          \u2014 download beat log as markdown",
        "metronome on|off      \u2014 toggle audible click",
        "swing <0\u20131>           \u2014 set rhythmic swing amount (0 = straight)",
        "sync                  \u2014 restart at next 5-second boundary",
        "help                  \u2014 show this message",
      ];

      function runCommand(raw) {
        const parts = raw.trim().split(/\s+/);
        const cmd = parts[0];
        const args = parts.slice(1);
        if (!cmd) return;

        switch (cmd.toLowerCase()) {
          case "start":
            initAudio();
            audioCtx.resume();
            clock.start();
            wall.start();
            appendAnn("playing  \u00b7  type offset / sync / mute / stop");
            break;

          case "stop":
            if (!clock) {
              appendAnn("not started");
              break;
            }
            clock.stop();
            wall.stop();
            appendAnn("stopped");
            break;

          case "bpm": {
            const b = parseFloat(args[0]);
            if (!isNaN(b) && b > 0) {
              if (!clock) {
                appendAnn("start first");
                break;
              }
              clock.setBPM(b);
              lastBpm = b;
              appendAnn("bpm: " + b);
            } else {
              appendAnn(
                "current bpm: " +
                  (clock ? Math.round(clock.bpm) : "\u2014") +
                  " (auto)",
              );
            }
            break;
          }

          case "offset": {
            const d = parseFloat(args[0]);
            if (!isNaN(d)) {
              timeOffset = d * 86400000;
              cachedCosmos = null;
              const sign = timeOffset >= 0 ? "+" : "";
              appendAnn(
                "time offset: " +
                  sign +
                  d +
                  " days  (" +
                  new Date(Date.now() + timeOffset).toUTCString() +
                  ")",
              );
            } else {
              const days = timeOffset / 86400000;
              appendAnn(
                "time offset: " +
                  (days >= 0 ? "+" : "") +
                  days.toFixed(2) +
                  " days",
              );
            }
            break;
          }

          case "set": {
            const arg = args.join(" ");
            if (!arg) {
              appendAnn("set <date>  e.g. set 2025-12-25  or set now");
              break;
            }
            let target;
            if (arg === "now") {
              target = Date.now();
            } else {
              const d = new Date(arg);
              target = isNaN(d.getTime()) ? NaN : d.getTime();
            }
            if (isNaN(target)) {
              appendAnn('could not parse date: "' + arg + '"');
            } else {
              timeOffset = target - Date.now();
              cachedCosmos = null;
              appendAnn("time set to " + new Date(target).toUTCString());
            }
            break;
          }

          case "location": {
            const la = parseFloat(args[0]),
              lo = parseFloat(args[1]);
            if (!isNaN(la) && !isNaN(lo)) {
              lat = la;
              lon = lo;
              cachedCosmos = null;
              appendAnn(
                "location: " +
                  lat.toFixed(4) +
                  "\u00b0, " +
                  lon.toFixed(4) +
                  "\u00b0",
              );
            } else {
              appendAnn(
                "location: " +
                  lat.toFixed(4) +
                  "\u00b0, " +
                  lon.toFixed(4) +
                  "\u00b0",
              );
            }
            break;
          }

          case "export": {
            const minutes = parseInt(args[0]) || 60;
            try {
              const md = exportScore(minutes);
              const blob = new Blob([md], { type: "text/markdown" });
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = "forever-song-" + Date.now() + ".md";
              a.click();
              URL.revokeObjectURL(url);
              appendAnn("exported last " + minutes + " min");
            } catch (e) {
              appendAnn("export error: " + e.message);
            }
            break;
          }

          case "metronome":
            if (args[0] === "on") {
              metronomeEnabled = true;
              appendAnn("metronome: on");
            } else if (args[0] === "off") {
              metronomeEnabled = false;
              appendAnn("metronome: off");
            } else appendAnn("metronome: " + (metronomeEnabled ? "on" : "off"));
            break;

          case "swing": {
            const s = parseFloat(args[0]);
            if (!clock) {
              appendAnn("start first");
              break;
            }
            if (!isNaN(s)) {
              const clamped = Math.max(0, Math.min(1, s));
              clock.setResolution(clamped);
              appendAnn("swing: " + clamped.toFixed(2));
            } else {
              appendAnn(
                "swing: " +
                  (clock.swing ?? 0).toFixed(2) +
                  "  (0 = straight, 1 = full swing)",
              );
            }
            break;
          }

          case "sync":
            if (!clock) {
              appendAnn("start first");
              break;
            }
            clock.stop();
            wall.stop();
            syncTarget = Math.ceil(Date.now() / 5000) * 5000;
            syncArmed = true;
            appendAnn(
              "sync armed \u2192 " +
                new Date(syncTarget).toISOString().split("T")[1].slice(0, 8) +
                " UTC",
            );
            break;

          case "help":
            HELP_TEXT.forEach(function (l) {
              appendAnn(l);
            });
            break;

          default:
            appendAnn('unknown: "' + cmd + '" \u2014 type help');
        }
      }

      // ═══ INPUT ════════════════════════════════════════════════════════════════
      const cmdInput = document.getElementById("cmd-input");
      const cmdTextEl = document.getElementById("cmd-text");
      const cmdHistory = [];
      let historyIdx = -1;

      function focusCmd() {
        cmdInput.focus();
      }
      document.addEventListener("click", focusCmd);
      document.addEventListener("keydown", function (e) {
        if (e.target !== cmdInput) cmdInput.focus();
      });

      cmdInput.addEventListener("input", function () {
        cmdTextEl.textContent = cmdInput.value;
      });

      cmdInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          const val = cmdInput.value;
          if (val.trim()) {
            cmdHistory.unshift(val);
            if (cmdHistory.length > 50) cmdHistory.pop();
          }
          historyIdx = -1;
          cmdInput.value = "";
          cmdTextEl.textContent = "";
          runCommand(val);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (historyIdx < cmdHistory.length - 1) historyIdx++;
          cmdInput.value = cmdHistory[historyIdx] || "";
          cmdTextEl.textContent = cmdInput.value;
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          if (historyIdx > 0) historyIdx--;
          else {
            historyIdx = -1;
            cmdInput.value = "";
          }
          cmdTextEl.textContent = cmdInput.value;
        }
      });

      // ═══ INIT ═════════════════════════════════════════════════════════════════
      const params = new URLSearchParams(location.search);
      if (params.has("lat")) lat = parseFloat(params.get("lat"));
      if (params.has("lon")) lon = parseFloat(params.get("lon"));
      if (params.has("days"))
        timeOffset = parseFloat(params.get("days")) * 86400000;

      appendAnn("forever song  \u00b7  an infinite generative score");
      appendAnn("");
      appendAnn(
        "key: moon phase cycle  \u00b7  tempo: 70\u2013100 bpm moon-driven",
      );
      appendAnn(
        "texture: sun elevation, Jupiter / Venus / Mars / Saturn altitudes",
      );
      appendAnn("");
      HELP_TEXT.forEach(function (l) {
        appendAnn(l);
      });
      appendAnn("");

      if (params.has("lat") || params.has("days")) runCommand("start");

      focusCmd();
    </script>
  </body>
</html>
